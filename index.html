<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commercial Detectives | Rhetorical Appeals</title>
<style>
:root{--navy:#16244c;--ink:#18233d;--sky:#dceeff;--cream:#fffaf0;--gold:#ffca62;--pink:#fce5ed;--mint:#dff8ea;--blue:#3d65cf;--border:#d5dff0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#e9f1ff,#fff8e9 70%,#f9ebf5);color:var(--ink);font:17px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:var(--navy);color:white;padding:24px 18px;text-align:center}header h1{margin:0;font-size:clamp(1.65rem,4vw,2.6rem);line-height:1.12}header p{margin:.5rem auto 0;max-width:650px}.shell{max-width:980px;margin:auto;padding:18px}.top{background:white;border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 7px 24px #17254b0c}.progress{background:#e8edfb;border-radius:100px;height:13px;overflow:hidden;min-width:170px;flex:1;max-width:440px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#3864d8,#2eae87);transition:width .3s}button{font:inherit;cursor:pointer;border-radius:12px;padding:11px 17px;font-weight:750;border:2px solid transparent;min-height:45px}button:focus-visible,input:focus-visible{outline:3px solid #ed913c;outline-offset:3px}.primary{background:#315cc4;color:#fff}.secondary{background:white;color:#264fac;border-color:#b9caef}.warning{background:#fff1d3;color:#543b00;border-color:#edc979}.danger{background:white;color:#9e314d;border-color:#f0bac7}.hidden{display:none!important}.panel{background:white;border:1px solid var(--border);border-radius:20px;padding:clamp(18px,3vw,32px);margin-top:17px;box-shadow:0 8px 25px #16244c0b}.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;font-weight:850;color:#4255a4}.panel h2{font-size:clamp(1.4rem,3.3vw,2rem);margin:.3rem 0 .7rem;line-height:1.2}.lead{font-size:1.1rem}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.chip{padding:5px 10px;border-radius:99px;background:#ecf1fb;font-weight:720;font-size:.88rem}.lesson-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.lesson-card{border-radius:16px;padding:18px;border:1px solid var(--border)}.ethos{background:#e7eeff}.pathos{background:#ffebf0}.logos{background:#e8f8eb}.lesson-card h3{margin:4px 0;font-size:1.28rem}.label{font-weight:800;color:#334c8a}.fakead{background:#15264f;color:white;padding:20px 24px;border-radius:18px;position:relative;margin:18px 0}.fakead:before{content:'FICTIONAL COMMERCIAL';display:block;color:#ffe2a2;font-weight:900;font-size:.7rem;letter-spacing:.13em;margin-bottom:10px}.fakead p{font-size:1.16rem;margin:0}.choices{display:grid;gap:10px;margin:17px 0}.choice{display:block;text-align:left;width:100%;background:#f4f7ff;color:#192b55;border:2px solid #cbd7ef;font-weight:680}.choice:hover:not(:disabled){background:#e6efff;border-color:#5779ca}.choice:disabled{cursor:default;opacity:1}.choice.correct{background:#def8e8;border-color:#25875b;color:#17462e}.choice.incorrect{background:#fff0ef;border-color:#d26969;color:#7c2626}.feedback{padding:14px;border-radius:12px;background:#f5f7fb;border-left:5px solid #5376c4;margin:12px 0}.feedback strong{display:block}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:15px}.hint{background:#fff4dd;border-radius:12px;padding:13px;margin:14px 0}.note{font-size:.92rem;color:#4b5874}.taskstep{color:#3355ac;font-weight:850}input{padding:11px;border-radius:10px;border:2px solid #aab9d6;font:inherit;max-width:100%;width:300px}ul{padding-left:1.35em}.resultbox{border:2px solid #85b8ad;border-radius:16px;background:#effaf5;padding:20px}.score{font-weight:900;font-size:3rem;margin:0;color:#1d6650}.print{display:none}.footer{text-align:center;font-size:.85rem;color:#596078;margin:20px 0 25px}@media(max-width:680px){.lesson-grid{grid-template-columns:1fr}.panel{padding:18px}.shell{padding:11px}}@media print{header,.top,.no-print,.footer{display:none!important}.print{display:block}.panel{box-shadow:none;border:0;margin:0;padding:0}.screen{display:none!important}}
</style></head><body>
<header><div style="font-weight:800;letter-spacing:.12em;font-size:.8rem;color:#ffd27a">THE LITERACY LOCKSMITH</div><h1>📺 Commercial Detectives</h1><p>Spot the hidden persuasion: <strong>Ethos • Pathos • Logos</strong></p></header>
<main class="shell"><div class="top no-print"><div><strong id="stage">Welcome</strong><div class="note" id="saved">Your progress saves on this device.</div></div><div class="progress" aria-label="Course progress"><span id="bar" style="width:0%"></span></div><button class="secondary" id="tts" type="button">🔊 Read this screen</button></div>
<div id="app" aria-live="polite"></div><div class="footer">The Literacy Locksmith · Donna Rees · © 2026 · Original fictional commercials for classroom practice</div></main>
<script>
'use strict';
const QUIZ=[["A dentist in a toothpaste ad says, “I have recommended this toothpaste to my patients for 12 years.”", "Ethos", "The ad points to a dentist’s experience to build trust."], ["A shelter commercial shows a shivering puppy and says, “You can give a pet a warm home.”", "Pathos", "The ad tries to make viewers feel concern and kindness."], ["A backpack commercial states, “Our bags hold 25 pounds and have six pockets.”", "Logos", "The ad supplies measurable details as reasons to buy."], ["A chef in an apron says, “After 20 years in professional kitchens, I choose this pan.”", "Ethos", "The chef’s professional experience is the reason to trust the product."], ["A sports drink ad shows teammates cheering after a big win while uplifting music plays.", "Pathos", "The scene creates excitement and a sense of belonging."], ["An ad claims, “This reusable bottle keeps water cold for up to 18 hours in our tests.”", "Logos", "A test result and number support the claim."], ["A veterinarian says, “As an animal doctor, I trust this pet brush.”", "Ethos", "The veterinarian is presented as a knowledgeable expert."], ["An ad shows a grandmother smiling as her family surprises her with a photo book.", "Pathos", "The scene appeals to love and family memories."], ["A bike-light commercial compares two lights: one lasts 4 hours, and the other lasts 10 hours.", "Logos", "It offers a numerical comparison."], ["A famous soccer player says, “I always wear these shoes, so you should too.”", "Ethos", "The ad uses a familiar spokesperson to gain trust, even though fame alone does not prove quality."], ["A cereal commercial says, “Imagine starting each morning with your family laughing around the table.”", "Pathos", "The ad tries to create warm, happy feelings."], ["A notebook ad says, “Our 200-page notebook costs $3, while the 150-page version costs $4.”", "Logos", "The ad compares price and page counts."]]; const PRACTICE=[["“As a firefighter, I rely on this flashlight during night emergencies.”", "Ethos", "The speaker uses professional experience."], ["A commercial shows a child hugging a lost dog that has just returned home.", "Pathos", "It makes viewers feel relief and happiness."], ["“This lunch container has three sections and is dishwasher-safe.”", "Logos", "These are product features that can be checked."], ["A famous musician endorses a pair of headphones without giving any test results.", "Ethos", "The ad borrows a familiar person’s reputation."], ["An ad plays sad music while showing a lonely animal behind a fence.", "Pathos", "Music and images are intended to stir emotion."], ["“The battery lasted 12 hours in our trial.”", "Logos", "The ad offers a test result."]]; const STORE='literacy-locksmith-commercial-appeals-v1';
const stages=['welcome','lesson','guided','practice','quizIntro','quiz','results'];
const blank=()=>({stage:'welcome',name:'',guided:0,practice:0,quiz:0,practiceAnswers:{},quizAnswers:{},order:[],finished:false});
let s=blank();try{const old=JSON.parse(localStorage.getItem(STORE)||'null');if(old&&stages.includes(old.stage))s={...blank(),...old}}catch(e){}
const app=document.getElementById('app');const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(s));document.getElementById('saved').textContent='Progress saved on this device.'}catch(e){document.getElementById('saved').textContent='Saving is unavailable in this browser.'}};
function shuffle(a){let v=[...a];for(let i=v.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[v[i],v[j]]=[v[j],v[i]]}return v}
function options(id){return shuffle(['Ethos','Pathos','Logos'])}
function go(next){s.stage=next;save();render();window.scrollTo({top:0,behavior:'instant'})}
function wrap(step,title,content,footer=''){return `<section class="panel screen"><div class="eyebrow">${step}</div><h2>${title}</h2>${content}${footer}</section>`}
function btn(text,method,klass='primary'){return `<button class="${klass}" type="button" data-action="${method}">${text}</button>`}
function card(a,title,what,clue,example){return `<article class="lesson-card ${a}"><div class="eyebrow">${what}</div><h3>${title}</h3><p>${clue}</p><p><strong>Ad example:</strong> “${example}”</p></article>`}
function feedback(item,answer){let isRight=item[1]===answer;return `<div class="feedback" role="status"><strong>${isRight?'✅ Correct!':'🧠 Keep learning!'}</strong>${esc(item[2])} <strong>Best answer: ${item[1]}.</strong></div>`}
function question(item,type,index,total,selected){let opts=type==='guided'?['Ethos','Pathos','Logos']:(s.order[type+'-'+index]||['Ethos','Pathos','Logos']);return `<div class="chips"><span class="chip">Commercial ${index+1} of ${total}</span><span class="chip">${type==='quiz'?'Final challenge':'Practice mission'}</span></div><p class="taskstep">Which appeal is the MAIN strategy?</p><div class="fakead"><p>${esc(item[0])}</p></div><div class="choices">${opts.map(o=>`<button class="choice ${selected?(o===item[1]&&type!=='quiz'?'correct':o===selected&&type!=='quiz'?'incorrect':''):''}" data-answer="${o}" ${selected?'disabled':''}>${o==='Ethos'?'🏅 ':o==='Pathos'?'💗 ':'📊 '}${o}</button>`).join('')}</div>${selected&&type!=='quiz'?feedback(item,selected):''}${selected&&type==='quiz'?`<div class="hint">✅ Answer saved. You will see your results after all 12 commercials.</div>`:''}${selected?`<div class="row">${btn(index===total-1?(type==='quiz'?'See my score':'Continue'):'Next commercial','next')}</div>`:''}`}
function initQuiz(){s.quiz=0;s.quizAnswers={};s.order={...s.order};for(let i=0;i<QUIZ.length;i++)s.order['quiz-'+i]=options(i);go('quiz')}
function render(){let x='',count=0;
if(s.stage==='welcome'){x=wrap('Start here • detective briefing','How do commercials convince us?',`<p class="lead">Commercials are short advertisements. They try to persuade people to buy something, try something, or support an idea. Your mission: identify the <strong>main persuasive appeal</strong>.</p><div class="hint">🎯 <strong>I can:</strong> Identify ethos, pathos, and logos in fictional commercials and explain which clue helped me decide.</div><label for="name"><strong>Student first and last name</strong></label><p><input id="name" maxlength="70" value="${esc(s.name)}" placeholder="Type your name" autocomplete="name"></p><div class="chips"><span class="chip">Learn the 3 appeals</span><span class="chip">6 guided practice questions</span><span class="chip">12 graded questions</span></div><p class="note">No real ads, external videos, accounts, or written responses are required. All scenarios are made up for learning.</p><div class="row">${btn('Start detective training','start')}</div>`)}
if(s.stage==='lesson'){x=wrap('Lesson 1 • learn the code','Three ways ads persuade',`<p>Rhetorical appeals are <strong>ways to persuade</strong>. A commercial may use more than one, but we will look for the <strong>strongest or main</strong> appeal.</p><div class="lesson-grid">${card('ethos','ETHOS','Trust / credibility','Someone tries to earn your trust by using expertise, experience, or a respected spokesperson.','As a veterinarian, I recommend this brush.')}${card('pathos','PATHOS','Feelings / emotion','Words, images, music, or stories try to make you feel happy, sad, hopeful, proud, or worried.','Imagine the joy of welcoming a rescued puppy.')}${card('logos','LOGOS','Reasons / evidence','The ad gives facts, numbers, comparisons, or explanations as reasons to believe a claim.','Our bottle keeps drinks cold for 18 hours.')}</div><div class="hint"><strong>Memory trick:</strong> Ethos = <strong>E</strong>xpert or trust. Pathos = <strong>P</strong>assion or feelings. Logos = <strong>L</strong>ogic or evidence.</div><h3>Think like a detective</h3><ul><li><strong>Who</strong> is asking me to trust them? → Ethos</li><li><strong>How</strong> does this ad want me to feel? → Pathos</li><li><strong>What proof</strong> does the ad give? → Logos</li></ul><p class="note">Important: An expert or celebrity can be wrong, and numbers can be misleading. Identifying an appeal does not mean the ad is truthful.</p><div class="row">${btn('Try a guided example','guidedStart')}</div>`)}
if(s.stage==='guided'){let samples=[['“As a school librarian, I recommend this reading lamp for students.”','Ethos','The librarian’s role is used to build trust.'],['Happy music plays while kids celebrate opening a new playground.','Pathos','The cheerful scene creates feelings of joy.'],['“Our pencils come in a pack of 24 for $5.”','Logos','The price and number of pencils are factual details.']];let item=samples[s.guided];x=wrap('Lesson 2 • solve it together','Look for the strongest clue',`<p>Read the sample commercial, then choose the main appeal. If you miss it, read the explanation and try the next one.</p>${question(item,'guided',s.guided,samples.length,s.practiceAnswers['guided-'+s.guided])}`)}
if(s.stage==='practice'){let item=PRACTICE[s.practice];x=wrap('Mission 1 • practice with feedback','Build your detective skills',`<p>Every answer includes a short explanation. This part is <strong>not graded</strong>.</p>${question(item,'practice',s.practice,PRACTICE.length,s.practiceAnswers[s.practice])}`)}
if(s.stage==='quizIntro'){x=wrap('Final mission • 12 commercials','Ready to earn your detective badge?',`<p class="lead">You will identify the main appeal in <strong>12 fictional commercials</strong>. Each correct answer earns <strong>2 points</strong> for a total of <strong>24 points</strong>.</p><div class="hint">🔍 Clue check: <strong>Ethos = trust</strong> · <strong>Pathos = emotion</strong> · <strong>Logos = reasons and evidence</strong>.</div><p>Choices are mixed to help everyone think independently. Your score is calculated automatically when you finish.</p><div class="row">${btn('Begin 24-point challenge','beginQuiz')}</div>`)}
if(s.stage==='quiz'){let item=QUIZ[s.quiz];x=wrap('Final mission • graded','Identify the main appeal',`<p>Read each commercial and choose the best answer. Answers cannot be changed after you select them.</p>${question(item,'quiz',s.quiz,QUIZ.length,s.quizAnswers[s.quiz])}`)}
if(s.stage==='results'){let correct=QUIZ.filter((q,i)=>s.quizAnswers[i]===q[1]).length;let score=correct*2;let pct=Math.round(100*correct/QUIZ.length);x=wrap('Mission complete • score report','Your Commercial Detective results',`<div class="resultbox"><p class="note">THE LITERACY LOCKSMITH · RHETORICAL APPEALS</p><h3>${esc(s.name||'Student')}</h3><p class="score">${score} / 24</p><p><strong>${correct} of 12 correct</strong> · ${pct}%</p><p>${pct>=83?'🏆 Excellent detecting!':pct>=67?'⭐ Good progress! Review any missed clues.':'🔍 Keep practicing! Each clue makes you a stronger detective.'}</p><p class="note">Completed: ${new Date().toLocaleString()}</p></div><h3>Review your clues</h3>${QUIZ.map((q,i)=>`<details style="margin:8px 0;padding:10px;border:1px solid #d7e0f0;border-radius:10px"><summary><strong>Commercial ${i+1}</strong> — ${s.quizAnswers[i]===q[1]?'✅ Correct':'❗ Review'}</summary><p>${esc(q[0])}</p><p>You chose: <strong>${esc(s.quizAnswers[i]||'No answer')}</strong>. Correct: <strong>${q[1]}</strong>.</p><p>${esc(q[2])}</p></details>`).join('')}<div class="hint"><strong>Canvas submission:</strong> Take a screenshot of the green score report showing your name and <strong>${score}/24</strong>. Upload the screenshot to the Canvas assignment as your teacher directs. Scores are saved on this device, not sent to your teacher automatically.</div><div class="row no-print">${btn('Print score report','print','secondary')}${btn('Start again (new score)','reset','warning')}</div><div class="print"><p>Student: ${esc(s.name)} | Score: ${score}/24 | Date: ${new Date().toLocaleDateString()}</p></div>`)}
app.innerHTML=x;document.getElementById('stage').textContent=({welcome:'Welcome',lesson:'Learn',guided:'Guided examples',practice:'Practice',quizIntro:'Final challenge',quiz:'Graded challenge',results:'Completed'})[s.stage];let progress=({welcome:0,lesson:12,guided:20+s.guided*7,practice:42+s.practice*5,quizIntro:70,quiz:72+s.quiz*2.3,results:100})[s.stage];document.getElementById('bar').style.width=Math.min(100,progress)+'%';save()}
app.addEventListener('click',e=>{let a=e.target.closest('[data-action]'),b=e.target.closest('[data-answer]');if(b){let v=b.dataset.answer;if(s.stage==='guided'){s.practiceAnswers['guided-'+s.guided]=v}else if(s.stage==='practice'){s.practiceAnswers[s.practice]=v}else if(s.stage==='quiz'){s.quizAnswers[s.quiz]=v}else return;save();render();return}if(!a)return;switch(a.dataset.action){case'start':{let n=document.getElementById('name')?.value.trim();if(!n){alert('Please enter your first and last name to begin.');return}s.name=n;go('lesson');break}case'guidedStart':s.guided=0;go('guided');break;case'next':if(s.stage==='guided'){if(s.guided<2){s.guided++;save();render()}else{s.practice=0;go('practice')}}else if(s.stage==='practice'){if(s.practice<PRACTICE.length-1){s.practice++;save();render()}else go('quizIntro')}else if(s.stage==='quiz'){if(s.quiz<QUIZ.length-1){s.quiz++;save();render()}else{s.finished=true;go('results')}}break;case'beginQuiz':initQuiz();break;case'print':window.print();break;case'reset':if(confirm('Start over? This will erase this activity’s saved answers and score on this device.')){s=blank();go('welcome')}break}});
let utterance=null;document.getElementById('tts').addEventListener('click',()=>{if(!('speechSynthesis'in window)){alert('Read-aloud is not supported in this browser.');return}if(speechSynthesis.speaking){speechSynthesis.cancel();document.getElementById('tts').textContent='🔊 Read this screen';return}let text=app.innerText.replace(/(?:Ethos|Pathos|Logos)\n/g,m=>m);utterance=new SpeechSynthesisUtterance(text);utterance.lang='en-US';utterance.rate=0.94;let voices=speechSynthesis.getVoices();utterance.voice=voices.find(v=>/google us english/i.test(v.name))||voices.find(v=>/google.*english/i.test(v.name)&&v.lang.toLowerCase().startsWith('en-us'))||voices.find(v=>v.lang.toLowerCase()==='en-us'&&!/compact/i.test(v.name))||null;utterance.onend=utterance.onerror=()=>document.getElementById('tts').textContent='🔊 Read this screen';speechSynthesis.speak(utterance);document.getElementById('tts').textContent='⏹ Stop reading'});
render();
</script></body></html>
